# /etc/nginx/sites-available/mc  — CraftMine website (certbot adds the TLS lines)
limit_req_zone $binary_remote_addr zone=craftmine_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mc.mikuuloves.coffee;

    client_max_body_size 64k;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/auth/login {
        limit_req zone=craftmine_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3031;
        include /etc/nginx/craftmine-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3031;
        include /etc/nginx/craftmine-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        include /etc/nginx/craftmine-proxy.conf;
    }
}
