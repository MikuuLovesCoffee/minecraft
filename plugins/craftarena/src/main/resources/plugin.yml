name: CraftArena
version: '${version}'
main: coffee.mikuuloves.craftarena.CraftArena
api-version: '26.3'
description: Gladiator duel arena with gear preparation, gates, rounds and a floating scoreboard.
author: MikuuLovesCoffee
softdepend: [Multiverse-Core, Essentials]
commands:
  join:
    description: Join the arena queue.
  leave:
    description: Leave the arena queue or give up the current match.
  ready:
    description: Ready for the next round (ends gear preparation).
  loadout:
    description: Pick your arena gear again (2 minutes in creative, only in your cell).
